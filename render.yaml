# Render Blueprint: https://render.com/docs/blueprint-spec
# Free tier (512MB): no Background Worker — reviews run in the API process.

envVarGroups:
  - name: synapse-backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_BASE
        value: https://api.groq.com/openai/v1
      - key: LLM_DEFAULT_PROVIDER
        value: openai
      - key: LLM_DEFAULT_MODEL
        value: gpt-4o
      # Free tier (512MB): no separate Celery worker — reviews run in the API process.
      - key: RUN_REVIEWS_INLINE
        value: "true"

services:
  - type: web
    name: synapse-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: synapse-backend
